<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./icon.svg?v=5" type="image/svg+xml" sizes="any">
  <meta name="theme-color" content="#080809">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">
       <svg class="jeran-logo" viewBox="0 0 64 64" aria-label="NEXUS Translator" role="img">
  <!-- Chevron supérieur gauche -->
  <path class="j1" d="M 33 11 L 16 27 L 33 43" />
  <!-- Chevron inférieur droit -->
  <path class="j2" d="M 35 25 L 51 41 L 35 57" />
</svg>
      </span>
      <span class="logo-text">NEXUS<em>Translator</em></span>
    </div>
    <nav class="tabs" aria-label="Navigation">
      <button class="tab active" data-view="translate" aria-pressed="true" aria-label="Traduire" title="Traduire"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2M5 5c0 5 4 8 8 10M13 5c0 5-4 9-9 11M13 21l4-10 4 10M15 17h4"/></svg><span>Traduire</span></button>
      <button class="tab" data-view="history" aria-pressed="false" aria-label="Historique" title="Historique"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>Historique</span></button>
      <button class="tab" data-view="favorites" aria-pressed="false" aria-label="Favoris" title="Favoris"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg><span>Favoris</span></button>
    </nav>
  </header>

  <main>
    <!-- VUE TRADUCTION -->
    <section id="view-translate" class="view active">
      <h1>Traduire</h1>
      <span id="status-text" class="sr-only" role="status"></span>
      <p id="net-badge" class="offline-notice" hidden>Hors ligne — traductions en cache disponibles.</p>

      <div class="lang-bar">
        <div class="lang-select">
          <label for="src-lang">De</label>
          <select id="src-lang"></select>
        </div>
        <button id="swap" class="swap-btn" title="Inverser les langues" aria-label="Inverser les langues">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <div class="lang-select">
          <label for="tgt-lang">Vers</label>
          <select id="tgt-lang"></select>
        </div>
      </div>

      <div class="register-bar" id="register-bar">
        <span class="register-label">Registre</span>
        <div class="register-toggle" role="group" aria-label="Registre de langue">
          <button class="reg-btn active" data-reg="neutral" aria-pressed="true">Neutre</button>
          <button class="reg-btn" data-reg="formal" aria-pressed="false" title="Formel (vous)">Formel</button>
          <button class="reg-btn" data-reg="informal" aria-pressed="false" title="Familier (tu)">Familier</button>
        </div>
      </div>

      <div class="panels">
        <div class="panel">
          <div class="panel-head">
            <span class="panel-lang">Texte source</span>
            <div class="panel-actions">
              <button class="icon-btn" id="paste" title="Coller">Coller</button>
              <button class="icon-btn" id="clear" title="Effacer">Effacer</button>
              <button class="icon-btn icon-only" id="speak-src" title="Écouter" aria-label="Écouter le texte source">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg>
              </button>
            </div>
          </div>
          <textarea id="source" aria-label="Texte source" placeholder="Tapez ou collez votre texte…"></textarea>
          <div class="panel-foot">
            <span id="char-count">0 caractères</span>
            <span id="src-name"></span>
          </div>
        </div>

        <div class="panel out">
          <div class="panel-head">
            <span class="panel-lang">Traduction</span>
            <div class="panel-actions">
              <button class="icon-btn" id="copy" title="Copier">Copier</button>
              <button class="icon-btn icon-only" id="fav" title="Ajouter aux favoris" aria-label="Ajouter aux favoris" aria-pressed="false">
                <svg class="ic ic-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.1 6.5L12 18.3 6.2 20.5l1.1-6.5L2.5 9.4l6.6-.9z"/></svg>
              </button>
              <button class="icon-btn icon-only" id="speak-tgt" title="Écouter" aria-label="Écouter la traduction">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg>
              </button>
            </div>
          </div>
          <div id="result" class="result" aria-live="polite"></div>
          <div id="phonetic" class="phonetic" hidden></div>
          <div id="alternatives" class="alternatives" hidden>
            <span class="alt-label">Variantes</span>
            <div id="alt-chips" class="alt-chips"></div>
          </div>
          <div class="panel-foot">
            <span id="result-meta"></span>
          </div>
        </div>
      </div>

    </section>

    <!-- VUE HISTORIQUE -->
    <section id="view-history" class="view">
      <div class="list-head">
        <h2>Historique</h2>
        <button class="ghost-btn" id="clear-history">Tout effacer</button>
      </div>
      <div id="history-list" class="list"></div>
    </section>

    <!-- VUE FAVORIS -->
    <section id="view-favorites" class="view">
      <div class="list-head">
        <h2>Favoris</h2>
        <button class="ghost-btn" id="clear-favorites">Tout effacer</button>
      </div>
      <div id="favorites-list" class="list"></div>
    </section>
  </main>
  <footer class="footer"><span>NEXUS Translator</span><a href="https://nexus-hubs.web.app/">Nexus Hub <span aria-hidden="true">↗</span></a></footer>

  <script src="languages.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
